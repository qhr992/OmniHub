<!doctype html>
<html lang="en">
  <head>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #dce7e5; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>

    <!-- OmniHub boot film: Lan, the keeper of the hub, says hello. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1280" data-height="720">
      <div
        id="boot"
        data-composition-id="boot"
        data-composition-src="compositions/boot.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1280"
        data-height="720"
      ></div>
      <audio id="chime" class="clip" src="assets/chime.wav" data-start="0" data-duration="7" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
